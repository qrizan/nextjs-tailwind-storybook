name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: npm ci
      # Storybook's own dependency tree (esbuild, puppeteer-core, and dozens
      # more) carries a long history of advisories and is devDependency-only:
      # it never ships in the runtime image (verified separately via Trivy
      # image scan). Auditing it here just repeats that noise against a tree
      # that was never at risk. --omit=dev restricts the audit to what
      # actually reaches production.
      - run: npm audit --omit=dev --audit-level=critical

  semgrep:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 wajib untuk --baseline-commit di bawah: butuh commit
      # baseline tersedia lokal, bukan cuma HEAD dari shallow clone bawaan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: pip install semgrep==1.173.0
      # Standalone (tanpa akun AppSec Platform) tidak bisa filter blocking
      # per severity: --severity Semgrep punya bug taksonomi lama vs baru
      # yang belum diperbaiki (rule CRITICAL malah lolos filter --severity
      # ERROR). --error menjadikan SEMUA temuan blocking, jadi supaya CI
      # tidak permanen merah oleh temuan lama, cakupannya dipersempit ke
      # temuan baru saja lewat diff-aware scan (--baseline-commit), murni
      # fitur CLI, tidak butuh token/akun.
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASELINE="${{ github.event.pull_request.base.sha }}"
          else
            BASELINE="${{ github.event.before }}"
          fi
          if [ -n "$BASELINE" ] && [ "$BASELINE" != "0000000000000000000000000000000000000000" ]; then
            semgrep scan --config auto --error --baseline-commit "$BASELINE"
          else
            semgrep scan --config auto --error
          fi

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # KNOWN RISK, not a Trivy/CI bug: building --target runner still builds
      # the builder stage first, which runs `npm run build`. Layout.tsx imports
      # Fira_Sans from next/font/google, fetching fonts.gstatic.com at build
      # time. If this step fails with EAI_AGAIN fonts.gstatic.com, that's the
      # font fetch, not this workflow.
      - run: docker build --target runner -t nextjs-tailwind-storybook:runner .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nextjs-tailwind-storybook:runner
          format: table
          exit-code: '1'
          severity: CRITICAL

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --no-git -v
