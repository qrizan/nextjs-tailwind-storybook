name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install semgrep==1.173.0
      - run: semgrep scan --config auto --error

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # KNOWN RISK, not a Trivy/CI bug: building --target runner still builds
      # the builder stage first, which runs `npm run build`. Layout.tsx imports
      # Fira_Sans from next/font/google, fetching fonts.gstatic.com at build
      # time. If this step fails with EAI_AGAIN fonts.gstatic.com, that's the
      # font fetch, not this workflow.
      - run: docker build --target runner -t nextjs-tailwind-storybook:runner .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nextjs-tailwind-storybook:runner
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
